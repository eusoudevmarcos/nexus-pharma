name: Quality gate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install and test Sites app
        run: npm ci
      - run: npm test

      - name: Install and build API
        working-directory: api
        run: npm ci
      - name: Validate Prisma schema
        working-directory: api
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/nexus_pharma?schema=public
        run: npm run prisma:validate
      - name: Build API
        working-directory: api
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/nexus_pharma?schema=public
        run: npm run build

      - name: Install portal
        working-directory: web
        run: npm ci
      - name: Lint portal
        working-directory: web
        run: npm run lint
      - name: Build portal
        working-directory: web
        run: npm run build

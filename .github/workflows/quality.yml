name: Nexus Pharma quality gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API e migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nexus_pharma
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run build

  web:
    name: Site e portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXUS_API_URL: https://api.example.invalid
      NEXT_PUBLIC_SITE_URL: https://app.example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

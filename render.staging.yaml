services:
  - type: web
    name: nexus-pharma-api
    runtime: node
    plan: free
    region: oregon
    rootDir: api
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build && npm run prisma:migrate:deploy
    initialDeployHook: npm run prisma:seed
    startCommand: npm start
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-pharma
          property: connectionString
      - key: NODE_VERSION
        value: 22.13.0
      - key: DEPLOYMENT_STAGE
        value: staging
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: JWT_ISSUER
        value: nexus-pharma-api
      - key: JWT_AUDIENCE
        value: nexus-pharma-web
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: MAX_ACTIVE_SESSIONS
        value: "5"
      - key: PRIVACY_REQUEST_SLA_DAYS
        value: "15"
      - key: AUTH_SESSION_RETENTION_DAYS
        value: "90"
      - key: ONE_TIME_TOKEN_RETENTION_DAYS
        value: "30"
      - key: DATABASE_RECOVERY_MODE
        value: NONE
      - key: DATABASE_RECOVERY_WINDOW_DAYS
        value: "0"
      - key: TRUST_PROXY
        value: "true"
      - key: LOG_LEVEL
        value: info
      - key: WEB_ORIGIN
        value: https://nexus-pharma-jade.vercel.app
      - key: WEB_APP_URL
        value: https://nexus-pharma-jade.vercel.app
      - key: OBSERVABILITY_TOKEN
        generateValue: true
      - key: DFE_CERTIFICATE_ENCRYPTION_KEY
        generateValue: true
      - key: DFE_ENABLE_SEFAZ_TRANSMISSION
        value: "false"
      - key: DFE_MAX_RESPONSE_BYTES
        value: "10000000"
      - key: NFCE_ENABLE_SEFAZ_TRANSMISSION
        value: "false"
      - key: NFCE_ALLOW_PRODUCTION_PREPARATION
        value: "false"
      - key: NFCE_SCHEMA_VERSION
        value: local-2026.08
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

services:
  - type: web
    name: nexus-pharma-api
    runtime: node
    plan: starter
    region: virginia
    rootDir: api
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run prisma:migrate:deploy
    initialDeployHook: npm run prisma:seed
    startCommand: npm start
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-pharma-db
          property: connectionString
      - key: NODE_VERSION
        value: 22.13.0
      - key: DEPLOYMENT_STAGE
        value: production
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: JWT_ISSUER
        value: nexus-pharma-api
      - key: JWT_AUDIENCE
        value: nexus-pharma-web
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: MAX_ACTIVE_SESSIONS
        value: "5"
      - key: PRIVACY_REQUEST_SLA_DAYS
        value: "15"
      - key: AUTH_SESSION_RETENTION_DAYS
        value: "90"
      - key: ONE_TIME_TOKEN_RETENTION_DAYS
        value: "30"
      - key: DATABASE_RECOVERY_MODE
        value: PITR
      - key: DATABASE_RECOVERY_WINDOW_DAYS
        value: "3"
      - key: TRUST_PROXY
        value: "true"
      - key: LOG_LEVEL
        value: info
      - key: WEB_ORIGIN
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: EMAIL_RELAY_URL
        sync: false
      - key: EMAIL_RELAY_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: BILLING_WEBHOOK_SECRET
        sync: false
      - key: BILLING_RELAY_URL
        sync: false
      - key: BILLING_RELAY_KEY
        sync: false
      - key: OBSERVABILITY_TOKEN
        generateValue: true
      - key: DFE_CERTIFICATE_ENCRYPTION_KEY
        generateValue: true
      - key: DFE_ENABLE_SEFAZ_TRANSMISSION
        value: "false"
      - key: DFE_DISTRIBUTION_URL_HOMOLOGATION
        sync: false
      - key: DFE_DISTRIBUTION_URL_PRODUCTION
        sync: false
      - key: DFE_EVENT_URL_HOMOLOGATION
        sync: false
      - key: DFE_EVENT_URL_PRODUCTION
        sync: false
      - key: DFE_MAX_RESPONSE_BYTES
        value: "10000000"
      - key: NFCE_ENABLE_SEFAZ_TRANSMISSION
        value: "false"
      - key: NFCE_ALLOW_PRODUCTION_PREPARATION
        value: "false"
      - key: NFCE_SCHEMA_VERSION
        value: local-2026.08
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

  - type: cron
    name: nexus-pharma-daily-automation
    runtime: node
    plan: starter
    region: virginia
    rootDir: api
    autoDeploy: false
    schedule: "0 10 * * *"
    buildCommand: npm ci && npm run build
    startCommand: npm run jobs:daily
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-pharma-db
          property: connectionString
      - key: NODE_VERSION
        value: 22.13.0
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_SESSION_RETENTION_DAYS
        value: "90"
      - key: ONE_TIME_TOKEN_RETENTION_DAYS
        value: "30"

databases:
  - name: nexus-pharma-db
    # Plano mínimo com backup e PITR; confirme preço e capacidade antes de sincronizar o Blueprint.
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: "18"
    connectionPool: none
    storageAutoscalingEnabled: true
    databaseName: nexus_pharma
    user: nexus_pharma
    ipAllowList: []

services:
  - type: web
    name: nexus-pharma-api
    runtime: node
    plan: free
    region: virginia
    rootDir: api
    autoDeploy: false
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run prisma:migrate:deploy && npm run prisma:seed
    startCommand: npm start
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-pharma-db
          property: connectionString
      - key: NODE_VERSION
        value: 22.13.0
      - key: DEPLOYMENT_STAGE
        value: staging
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: JWT_ISSUER
        value: nexus-pharma-api
      - key: JWT_AUDIENCE
        value: nexus-pharma-web
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: MAX_ACTIVE_SESSIONS
        value: "5"
      - key: PRIVACY_REQUEST_SLA_DAYS
        value: "15"
      - key: AUTH_SESSION_RETENTION_DAYS
        value: "90"
      - key: ONE_TIME_TOKEN_RETENTION_DAYS
        value: "30"
      - key: DATABASE_RECOVERY_MODE
        value: NONE
      - key: DATABASE_RECOVERY_WINDOW_DAYS
        value: "0"
      - key: TRUST_PROXY
        value: "true"
      - key: LOG_LEVEL
        value: info
      - key: WEB_ORIGIN
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: EMAIL_RELAY_URL
        sync: false
      - key: EMAIL_RELAY_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: BILLING_WEBHOOK_SECRET
        sync: false
      - key: BILLING_RELAY_URL
        sync: false
      - key: BILLING_RELAY_KEY
        sync: false
      - key: OBSERVABILITY_TOKEN
        generateValue: true
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

  - type: cron
    name: nexus-pharma-daily-automation
    runtime: node
    plan: starter
    region: virginia
    rootDir: api
    autoDeploy: false
    schedule: "0 10 * * *"
    buildCommand: npm ci && npm run build
    startCommand: npm run jobs:daily
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-pharma-db
          property: connectionString
      - key: NODE_VERSION
        value: 22.13.0
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_SESSION_RETENTION_DAYS
        value: "90"
      - key: ONE_TIME_TOKEN_RETENTION_DAYS
        value: "30"

databases:
  - name: nexus-pharma-db
    # Bloqueador de go-live: o plano gratuito não oferece restauração gerenciada.
    # Suba para um plano pago e ajuste DATABASE_RECOVERY_MODE=PITR antes de clientes reais.
    plan: free
    region: virginia
    databaseName: nexus_pharma
    user: nexus_pharma
    ipAllowList: []
